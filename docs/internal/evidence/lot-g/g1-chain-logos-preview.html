<!doctype html><html><head><meta charset="utf-8"><style>
  body{margin:0;background:#1c1c1c;font-family:-apple-system,system-ui,sans-serif;padding:28px;color:#e2e6e1}
  h1{font-size:15px;font-weight:700;margin:0 0 4px}
  p{font-size:12px;color:#9a9b99;margin:0 0 22px}
  .row{display:flex;gap:26px;flex-wrap:wrap}
  .cell{display:flex;flex-direction:column;align-items:center;gap:8px;width:70px}
  .chip{width:30px;height:30px;border-radius:9px;display:flex;align-items:center;justify-content:center;
        font-weight:700;font-size:12px;overflow:hidden}
  .chip img{width:62%;height:62%;object-fit:contain}
  .lbl{font-size:11px;color:#b7b3ab;font-weight:600}
  .sub{font-size:10px;color:#6e6a62}
  .divider{margin:26px 0 20px;border-top:1px solid #333}
</style></head><body>
  <h1>G1.1 — Bridge chain marks (BrandLogo, monogram-safe fallback)</h1>
  <p>Bundled brand SVG for the top-7 chains in bridge_flows; unmapped chains keep the letter monogram (no broken image).</p>
  <div class="row" id="mapped"></div>
  <div class="divider"></div>
  <p style="margin:0 0 14px">Fallback (no bundled SVG) — clean monogram, exactly as before:</p>
  <div class="row" id="fallback"></div>
  <script>
    const base='../../../apps/web/src/assets/chains/'
    const mapped=[
      ['BAS','Base','base.svg','#16233A','#5B8DEF'],
      ['POL','Polygon','polygon.svg','#231640','#A579F0'],
      ['ETH','Ethereum','ethereum.svg','#1E2340','#8AA0E6'],
      ['SOL','Solana','solana.svg','#241633','#B072F5'],
      ['ARB','Arbitrum','arbitrum.svg','#16283A','#4FA8E0'],
      ['BSC','BNB Chain','bnb.svg','#332B10','#E6B93B'],
      ['CEL','Celo','celo.svg','#0F3021','#35D07F'],
    ]
    const fb=[['TRX','Tron','#3A1616','#E05555'],['AVA','Avalanche','#3A1616','#E06A6A'],['SUI','Sui','#16283A','#4FB8E0']]
    document.getElementById('mapped').innerHTML=mapped.map(([c,n,f,t,col])=>
      `<div class="cell"><div class="chip" style="background:${t};color:${col}"><img src="${base}${f}"></div>
       <div class="lbl">${c}</div><div class="sub">${n}</div></div>`).join('')
    document.getElementById('fallback').innerHTML=fb.map(([c,n,t,col])=>
      `<div class="cell"><div class="chip" style="background:${t};color:${col}">${c[0]}</div>
       <div class="lbl">${c}</div><div class="sub">${n}</div></div>`).join('')
  </script>
</body></html>
