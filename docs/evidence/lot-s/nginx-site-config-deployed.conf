# stellar-api.getdig.ai — nginx site config
# Lot S (2026-08-17): rate-limit zones + security headers in front of the Nest API.
# Zone values derive from the OBSERVED traffic baseline (docs/evidence/lot-s/
# s0-surface-recon.md §3-4) — worst legit single-IP minute was 62 req/min; a full
# dashboard page load is ~20 requests incl. preflights. Documented in
# docs/deployment.md — keep both in sync.

# General API zone: 10 r/s steady, burst absorbs a page load ×3. The dashboard
# must never trip this; scanner floods (observed 340 req/min) must.
limit_req_zone $binary_remote_addr zone=api_general:10m rate=10r/s;

# Action builds cost Soroban RPC simulation: low steady rate, interactive burst.
# Observed legit volume: 29 POSTs over two days.
limit_req_zone $binary_remote_addr zone=api_actions:10m rate=30r/m;

# Mutations (wallet/alert/notification writes) are click-driven. Keyed by IP only
# for POST/PATCH/DELETE — an empty key exempts reads from this zone.
map $request_method $mutation_key {
    default "";
    POST    $binary_remote_addr;
    PATCH   $binary_remote_addr;
    DELETE  $binary_remote_addr;
}
limit_req_zone $mutation_key zone=api_mutations:10m rate=2r/s;

server {
    server_name stellar-api.getdig.ai;

    server_tokens off;
    # Largest legit request body is a small JSON action payload (XDR travels in
    # RESPONSES, not requests) — 100k is generous.
    client_max_body_size 100k;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    limit_req_status 429;
    error_page 429 = @rate_limited;

    # Plain JSON 429 so the web app can show an honest "slow down" instead of a
    # parse error. ACAO echoes the origin so browsers let the app READ the 429
    # (static body, nothing sensitive). Retry-After matches the general zone.
    location @rate_limited {
        default_type application/json;
        add_header Retry-After "1" always;
        add_header Access-Control-Allow-Origin $http_origin always;
        add_header Access-Control-Allow-Credentials "true" always;
        return 429 '{"statusCode":429,"error":"Too Many Requests","message":"Rate limit exceeded - please slow down."}';
    }

    location /v1/actions/ {
        limit_req zone=api_actions burst=10 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /v1/ {
        limit_req zone=api_general burst=60 nodelay;
        limit_req zone=api_mutations burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=api_general burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/stellar-api.getdig.ai/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/stellar-api.getdig.ai/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = stellar-api.getdig.ai) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name stellar-api.getdig.ai;
    return 404; # managed by Certbot


}
