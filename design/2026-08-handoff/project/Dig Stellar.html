document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

onnected: false,\n    watchInput: '',\n    selectedPoolId: 'blend-usdc',\n    // alert builder\n    alertScope: 'venue',\n    alertMetric: 'apy',\n    alertOp: 'lt',\n    alertThreshold: '4.5',\n    alertSeverity: 'warning',\n    // action flow\n    actionStep: 1,\n    actionType: 'supply',\n    actionAmount: '2,500',\n    xdrOpen: false,\n    signing: false,\n    // rule toggles\n    rulesOn: { r1: true, r2: true, r3: false, r4: true },\n    refreshing: false,\n    refreshedAt: 'now',\n  };\n\n  ACCENT = '#252525';\n  LIME = '#D5FF2F';\n\n  LOGOS = {\n    blend: '<svg width=\"60%\" height=\"60%\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"><path d=\"M6 3h6a4 4 0 0 1 0 8H6z\"/><path d=\"M6 11h7a4.3 4.3 0 0 1 0 9H6z\"/><\u002Fsvg>',\n    aqua: '<svg width=\"64%\" height=\"64%\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 7c2-2.4 4-2.4 6 0s4 2.4 6 0 4-2.4 6 0\"/><path d=\"M2 12c2-2.4 4-2.4 6 0s4 2.4 6 0 4-2.4 6 0\"/><path d=\"M2 17c2-2.4 4-2.4 6 0s4 2.4 6 0 4-2.4 6 0\"/><\u002Fsvg>',\n    soro: '<svg width=\"60%\" height=\"60%\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 9h13M14 6l3 3-3 3\"/><path d=\"M20 15H7M10 12l-3 3 3 3\"/><\u002Fsvg>',\n  };\n\n  protoLogo(v) {\n    const t = (v || '').toLowerCase();\n    if (t.includes('blend')) return this.LOGOS.blend;\n    if (t.includes('aquar') || t.includes('aqua')) return this.LOGOS.aqua;\n    if (t.includes('soro')) return this.LOGOS.soro;\n    return '';\n  }\n\n  POOLS = {\n    'blend-usdc': { mark:'B', tint:'#EAF1FD', color:'#2E6FD6', pair:'USDC Lending', venue:'Blend V2', type:'Lending market', tvl:'$18.4M', apy:'6.82%', vol:'$2.1M', util:'71%' },\n    'aqua-xlm-usdc': { mark:'A', tint:'#E7F6F4', color:'#159A8C', pair:'XLM / USDC', venue:'Aquarius', type:'AMM pool', tvl:'$9.2M', apy:'14.3%', vol:'$3.8M', util:'—' },\n    'soro-xlm-usdc': { mark:'S', tint:'#FBEEE8', color:'#D86A3E', pair:'XLM / USDC', venue:'Soroswap', type:'AMM pair', tvl:'$6.7M', apy:'11.7%', vol:'$2.9M', util:'—' },\n    'blend-xlm': { mark:'B', tint:'#EAF1FD', color:'#2E6FD6', pair:'XLM Lending', venue:'Blend V2', type:'Lending market', tvl:'$12.1M', apy:'4.10%', vol:'$1.4M', util:'58%' },\n    'aqua-aqua-usdc': { mark:'A', tint:'#E7F6F4', color:'#159A8C', pair:'AQUA / USDC', venue:'Aquarius', type:'AMM pool', tvl:'$4.3M', apy:'22.6%', vol:'$1.1M', util:'—' },\n    'soro-eurc-usdc': { mark:'S', tint:'#FBEEE8', color:'#D86A3E', pair:'EURC / USDC', venue:'Soroswap', type:'AMM pair', tvl:'$3.1M', apy:'8.40%', vol:'$0.7M', util:'—' },\n    'blend-eurc': { mark:'B', tint:'#EAF1FD', color:'#2E6FD6', pair:'EURC Lending', venue:'Blend V2', type:'Lending market', tvl:'$2.8M', apy:'5.55%', vol:'$0.4M', util:'44%' },\n  };\n\n  go = (s) => this.setState({ screen: s, modal: null });\n  stop = (e) => { e.stopPropagation(); };\n  closeModal = () => this.setState({ modal: null, signing: false, actionStep: 1, xdrOpen: false });\n\n  openConnect = () => { if (this.state.connected) { this.setState({ modal: 'connect' }); } else { this.setState({ modal: 'connect' }); } };\n  openAddWallet = () => this.setState({ modal: 'connect' });\n  openCreateAlert = () => this.setState({ modal: 'alert' });\n  openCreateAlertForPool = () => this.setState({ modal: 'alert', alertScope: 'venue' });\n  openAlertsBell = () => this.setState({ screen: 'alerts', modal: null });\n\n  selectPool = (id) => this.setState({ screen: 'pool', selectedPoolId: id, modal: null });\n  openActionForPool = () => this.setState({ modal: 'action', actionStep: 1, actionType: 'supply', signing: false, xdrOpen: false });\n  openActionWithdraw = () => this.setState({ modal: 'action', actionStep: 1, actionType: 'withdraw', signing: false, xdrOpen: false });\n\n  addWatchWallet = () => { this.setState({ modal: null, watchInput: '' }); };\n  pickProvider = () => { this.setState({ connected: true, modal: null }); };\n  onWatchInput = (e) => this.setState({ watchInput: e.target.value });\n\n  refreshBalances = () => {\n    if (this.state.refreshing) return;\n    this.setState({ refreshing: true });\n    setTimeout(() => this.setState({ refreshing: false, refreshedAt: 'just now' }), 1400);\n  };\n\n  toggleRule = (k) => this.setState(s => ({ rulesOn: { ...s.rulesOn, [k]: !s.rulesOn[k] } }));\n  onThresholdInput = (e) => this.setState({ alertThreshold: e.target.value });\n  onAmountInput = (e) => this.setState({ actionAmount: e.target.value });\n  toggleXdr = () => this.setState(s => ({ xdrOpen: !s.xdrOpen }));\n\n  actionNext = () => {\n    const st = this.state.actionStep;\n    if (st === 1) this.setState({ actionStep: 2 });\n    else if (st === 2) { this.setState({ actionStep: 3, signing: true }); setTimeout(() => { if (this.state.actionStep === 3) this.setState({ signing: false, actionStep: 4 }); }, 2600); }\n    else if (st === 4) this.closeModal();\n  };\n  actionBack = () => this.setState(s => ({ actionStep: Math.max(1, s.actionStep - 1), signing: false }));\n  backToReview = () => this.setState({ actionStep: 2, signing: false });\n\n  // ---- sparkline / chart builders (data viz) ----\n  spark(seed, color, w, h) {\n    const pts = []; let v = 50;\n    for (let i = 0; i < 28; i++) { v += (Math.sin(i * seed) + Math.cos(i * 0.7 + seed)) * 6 + (i * 0.4); pts.push(v); }\n    const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;\n    const step = w / (pts.length - 1);\n    const line = pts.map((p, i) => `${(i * step).toFixed(1)},${(h - ((p - min) / rng) * (h - 6) - 3).toFixed(1)}`).join(' ');\n    const area = `0,${h} ${line} ${w},${h}`;\n    const gid = 'g' + String(seed).replace('.', '');\n    return `<svg width=\"100%\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\"><defs><linearGradient id=\"${gid}\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${color}\" stop-opacity=\"0.16\"/><stop offset=\"1\" stop-color=\"${color}\" stop-opacity=\"0\"/><\u002FlinearGradient><\u002Fdefs><polygon points=\"${area}\" fill=\"url(#${gid})\"/><polyline points=\"${line}\" fill=\"none\" stroke=\"${color}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>`;\n  }\n\n  bigChart(lineColor, fillColor) {\n    fillColor = fillColor || lineColor;\n    const w = 640, h = 150; const pts = []; let v = 60;\n    for (let i = 0; i < 60; i++) { v += (Math.sin(i * 0.5) * 5) + (Math.cos(i * 0.23) * 7) + 1.1; pts.push(v); }\n    const min = Math.min(...pts), max = Math.max(...pts), rng = (max - min) || 1;\n    const step = w / (pts.length - 1);\n    const line = pts.map((p, i) => `${(i * step).toFixed(1)},${(h - ((p - min) / rng) * (h - 14) - 7).toFixed(1)}`).join(' ');\n    const area = `0,${h} ${line} ${w},${h}`;\n    return `<svg width=\"100%\" height=\"${h}\" viewBox=\"0 0 ${w} ${h}\" preserveAspectRatio=\"none\"><defs><linearGradient id=\"hero\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"${fillColor}\" stop-opacity=\"0.55\"/><stop offset=\"1\" stop-color=\"${fillColor}\" stop-opacity=\"0\"/><\u002FlinearGradient><\u002Fdefs><polygon points=\"${area}\" fill=\"url(#hero)\"/><polyline points=\"${line}\" fill=\"none\" stroke=\"${lineColor}\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><\u002Fsvg>`;\n  }\n\n  poolChartSvg() {\n    const w = 700, h = 190; const bars = 30; const bw = w / bars;\n    let line = []; let v = 60;\n    let barsHtml = '';\n    for (let i = 0; i < bars; i++) {\n      const vol = 30 + Math.abs(Math.sin(i * 0.6) * 55) + Math.random() * 10;\n      const bh = (vol / 110) * (h * 0.55);\n      barsHtml += `<rect x=\"${(i * bw + 3).toFixed(1)}\" y=\"${(h - bh).toFixed(1)}\" width=\"${(bw - 6).toFixed(1)}\" height=\"${bh.toFixed(1)}\" rx=\"3\" fill=\"#ECEAE3\"/>`;\n      v +=
